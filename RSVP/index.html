								<div>
									<h1 style="text-align: center;">RSVP</h1>
									<p>If you know you are unable to attend, please let us know ASAP. Thank you!</p>
									
									<button style="text-transform: uppercase; font-family: 'Courier New', Courier, monospace;" class="open-btn" onclick="openForm()">Let us know if you can make it!</button>

									<!-- Overlay & Form -->
									<div class="overlay" id="formOverlay" onclick="closeForm(event)">
										<div class="form-container">
											<span class="close-x" onclick="closeForm()">✕</span>

											<h2>RSVP</h2>

											<form class="rsvp-form" id="rsvpForm">

												<!-- Responder Name -->
												<div class="form-section">
													<label class="section-label">
													Name <span style="font-size:x-small;">(required)</span>
													</label>

													<div class="name-row">
													<div class="field">
														<input type="text" name="responderFirstName" required>
														<label class="floating-label">First Name</label>
													</div>

													<div class="field">
														<input type="text" name="responderLastName" required>
														<label class="floating-label">Last Name</label>
													</div>
													</div>
												</div>

												<!-- Attendance + Guest Count (side-by-side) -->
												<div class="attendance-row">

													<!-- Attendance -->
													<div class="form-section">
													<label class="section-label">
														Will you be attending? <span style="font-size:x-small;">(required)</span>
													</label>

													<div class="radio-group">
														<label class="radio-option">
														<input type="radio" name="responderAttending" value="Yes" required onchange="handleAttendanceChange()">
														<span class="custom-radio"></span> Yes
														</label>

														<label class="radio-option">
														<input type="radio" name="responderAttending" value="No" onchange="handleAttendanceChange()">
														<span class="custom-radio"></span> No
														</label>
													</div>
													</div>

													<!-- Guest Count -->
													<div class="form-section" id="guestCountSection" style="display:none;">
													<label class="section-label">
														Total guests attending <span style="font-size:x-small;">If listed on invitation</span>
													</label>

													<div class="guest-counter">
														<button type="button" onclick="changeGuestCount(-1)">−</button>
														<span id="guestCount">1</span>
														<button type="button" onclick="changeGuestCount(1)">+</button>
													</div>

													<input type="hidden" name="guestCount" id="guestCountInput" value="1">
													</div>

												</div>

												<!-- ATTENDING ONLY -->
												<div id="attendingOnlySection" style="display:none;">

													<!-- Additional Guests -->
													<div id="additionalGuests"></div>

													<!-- Welcome Party + Movie (side-by-side) -->
													<div class="attendance-row">

													<!-- Welcome Party -->
													<div class="form-section">
														<label class="section-label">
														Will you be attending the welcome party?
														</label>

														<div class="radio-group">
														<label class="radio-option">
															<input type="radio" name="welcome_party" value="Yes">
															<span class="custom-radio"></span> Yes
														</label>

														<label class="radio-option">
															<input type="radio" name="welcome_party" value="No">
															<span class="custom-radio"></span> No
														</label>
														</div>
													</div>

													<!-- Movie Choice -->
													<div class="form-section">
														<label class="section-label">
														Movie preference during the welcome party
														</label>

														<div class="radio-group">
														<label class="radio-option">
															<input type="radio" name="movie" value="Option A">
															<span class="custom-radio"></span> Option A
														</label>
														<label class="radio-option">
															<input type="radio" name="movie" value="Option B">
															<span class="custom-radio"></span> Option B
														</label>
														<label class="radio-option">
															<input type="radio" name="movie" value="Option C">
															<span class="custom-radio"></span> Option C
														</label>
														<label class="radio-option">
															<input type="radio" name="movie" value="Option D">

														</label>
														</div>
													</div>

													</div>

													<!-- Dietary Notes -->

														<label class="section-label">Dietary restrictions or notes</label>
														<div class="field">
															<input type="text" name="notes">
														</div>
													</div>

												</div>

												<!-- Yeass Messages -->
												<div class="form-section" id="yesMessage" style="display:none; text-align:center;">
													<label>Yay! We are so excited to celebrate with you!</label>
												</div>

				<!-- Footer -->

		<!-- Scripts -->
			<script src="/assets/js/jquery.min.js"></script>

			<script>
				document.addEventListener('DOMContentLoaded', function () {
					const toggle = document.querySelector('.menu-toggle');
					if (!toggle) return;

					toggle.addEventListener('click', function () {
						document.body.classList.toggle('nav-open');

						const expanded = toggle.getAttribute('aria-expanded') === 'true';
						toggle.setAttribute('aria-expanded', String(!expanded));
					});
				});
			</script>

		<!--RSVP Form -->
			<script>
			/* ===============================
   GLOBAL STATE
================================ */
let guestCount = 1;
const maxGuests = 6;

/* ===============================
   MODAL CONTROLS
================================ */
function openForm() {
  document.getElementById("formOverlay").style.display = "flex";
  document.body.classList.add("no-scroll");
}

function closeForm(event) {
  const overlay = document.getElementById("formOverlay");
  const form = document.getElementById("rsvpForm");

  if (!overlay || !form) return; // safety check

  if (!event || event.target?.id === "formOverlay") {
    overlay.style.display = "none";
    document.body.classList.remove("no-scroll");
    form.style.display = "block";
  }
}

/* ===============================
   ATTENDANCE LOGIC
================================ */
function handleAttendanceChange() {
  const attending = document.querySelector(
    'input[name="responderAttending"]:checked'
  )?.value;

  const attendingSection = document.getElementById("attendingOnlySection");
  const guestCountSection = document.getElementById("guestCountSection");
  const sorryMessage = document.getElementById("sorryMessage");
  const yesMessage = document.getElementById("yesMessage");
  const additionalGuests = document.getElementById("additionalGuests");


  // Hide both messages initially
  yesMessage.style.display = "none";
  sorryMessage.style.display = "none";

	if (attending === "Yes") {
    // Open the modal in case it was closed
    document.getElementById("formOverlay").style.display = "flex";
    document.body.classList.add("no-scroll");

    // Show attending sections
    attendingSection.style.display = "block";
    guestCountSection.style.display = "block";

    // Show "Yes" message
    yesMessage.style.display = "block";

    renderAdditionalGuests();
  } else if (attending === "No") {
    // Open the modal in case it was closed
    document.getElementById("formOverlay").style.display = "flex";
    document.body.classList.add("no-scroll");

    // Hide attending sections
    attendingSection.style.display = "none";
    guestCountSection.style.display = "none";

    guestCount = 1;
    document.getElementById("guestCount").textContent = "1";
    document.getElementById("guestCountInput").value = "1";
    additionalGuests.innerHTML = "";

    document.querySelectorAll('input[name="welcome_party"], input[name="movie"]')
      .forEach(i => i.checked = false);

    // Show "Sorry" message
    sorryMessage.style.display = "block";
  


  

    guestCount = 1;
    document.getElementById("guestCount").textContent = "1";
    document.getElementById("guestCountInput").value = "1";
    additionalGuests.innerHTML = "";

    document
      .querySelectorAll('input[name="welcome_party"], input[name="movie"]')
      .forEach(i => i.checked = false);
  }
}

/* ===============================
   GUEST COUNTER
================================ */
function changeGuestCount(amount) {
  guestCount = Math.min(Math.max(1, guestCount + amount), maxGuests);
  document.getElementById("guestCount").textContent = guestCount;
  document.getElementById("guestCountInput").value = guestCount;
  renderAdditionalGuests();
}

function renderAdditionalGuests() {
  const container = document.getElementById("additionalGuests");
  container.innerHTML = "";

  for (let i = 2; i <= guestCount; i++) {
    container.innerHTML += `
      <div class="form-section">
        <label class="section-label">Guest ${i} Name</label>
        <div class="name-row">
          <div class="field">
            <input type="text" name="guest${i}FirstName">
            <label class="floating-label">First Name</label>
          </div>
          <div class="field">
            <input type="text" name="guest${i}LastName">
            <label class="floating-label">Last Name</label>
          </div>
        </div>
      </div>
    `;
  }
}

/* ===============================
   FORM SUBMISSION
================================ */
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("rsvpForm");

  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    // Build payload
    const payload = {
      responderFirstName: form.responderFirstName.value,
      responderLastName: form.responderLastName.value,
      attending: form.responderAttending.value,
      guestCount: form.responderAttending.value === "Yes" ? guestCount : 0,
      guests: collectGuests(form),
      welcomeParty: form.welcome_party?.value || "",
      movie: form.movie?.value || "",
      notes: form.notes?.value || ""
    };

    console.log("Submitting payload:", payload);

    try {
      const response = await fetch(
        "https://script.google.com/macros/s/AKfycbyjy5u8bUDeXHuWTrWYcB_NnWWFI6YuR5OUf4xziQ3BrqJVJZHE3f_9nxOdzldPwtZhrw/exec", // <-- replace with your Apps Script URL
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }
      );

      const result = await response.json();
      console.log("Server response:", result);

      if (result.success) {
        showSuccessMessage();
        form.reset();
      } else {
        alert("Submission failed: " + result.error);
      }

    } catch (err) {
      console.error("Fetch error:", err);
      alert("Submission failed. Check console for details.");
    }
  });
});

/**
 * Collect guest names
 */
function collectGuests(form) {
  const guests = [
    { first: form.responderFirstName.value, last: form.responderLastName.value }
  ];

  for (let i = 2; i <= guestCount; i++) {
    guests.push({
      first: form[`guest${i}FirstName`]?.value || "",
      last: form[`guest${i}LastName`]?.value || ""
    });
  }

  return guests;
}

/**
 * Show success message
 */
function showSuccessMessage() {
  document.getElementById("rsvpForm").style.display = "none";
  document.getElementById("successMessage").style.display = "block";

  setTimeout(() => {
    closeForm();
  }, 3000);
}
</script>
